*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif;background:#f0f2f5;color:#222}
.topbar{background:linear-gradient(135deg,#1a3a6b 0%,#2F5496 100%);color:#fff;padding:28px 36px}
.topbar h1{font-size:26px;font-weight:700;letter-spacing:1px}
.topbar .meta{font-size:13px;opacity:.8;margin-top:6px}
.main{max-width:1400px;margin:0 auto;padding:20px}
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.kpi-card{background:#fff;border-radius:10px;padding:16px 20px;box-shadow:0 1px 4px rgba(0,0,0,.05);text-align:center}
.kpi-card .val{font-size:26px;font-weight:800;color:#2F5496}
.kpi-card .unit{font-size:13px;color:#999;font-weight:400}
.kpi-card .lbl{font-size:11px;color:#888;margin-top:4px}
.kpi-card.down .val{color:#1a8a3f}
.kpi-card.up .val{color:#d93025}
.section{margin-bottom:20px}
.section-title{font-size:19px;font-weight:700;color:#1a3a6b;margin-top:8px;margin-bottom:12px}
.insight-box{background:#fef9e7;border-left:3px solid #f0b90b;padding:10px 14px;border-radius:4px;font-size:12px;color:#7d6608;margin-bottom:12px;line-height:1.6}
.insight-box strong{color:#5c4308}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border-radius:10px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card h4{font-size:14px;color:#2F5496;margin-bottom:10px}
.chart-box{position:relative;height:280px}
.chart-box-tall{position:relative;height:360px}
.full-width{grid-column:1/-1}
.mini-table{width:100%;font-size:11px;border-collapse:collapse;margin-top:8px}
.mini-table th{background:#f5f6f8;color:#555;padding:6px 8px;text-align:left;font-weight:600;border-bottom:2px solid #e0e0e0}
.mini-table td{padding:5px 8px;border-bottom:1px solid #f0f0f0}
.mini-table .pos{color:#d93025;font-weight:600}
.mini-table .neg{color:#1a8a3f;font-weight:600}
.mini-table .num{text-align:right}
.mini-table tr:hover{background:#fafbfc}
.tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:600}
.tag-blue{background:#e3edff;color:#2F5496}
.tag-orange{background:#fff3e0;color:#e65100}
.tag-green{background:#e8f5e9;color:#2e7d32}
.tag-yellow{background:#fff8e1;color:#f9a825}
.tag-purple{background:#f3e5f5;color:#7b1fa2}
.subtitle{font-size:11px;color:#999;margin-bottom:8px}
.footer{text-align:center;padding:16px;font-size:11px;color:#aaa;margin-top:10px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.kpi-strip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
