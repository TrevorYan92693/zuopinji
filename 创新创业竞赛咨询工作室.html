<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创新创业竞赛咨询工作室 · 项目展示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#2563eb; --blue-strong:#1d4ed8; --blue-soft:#eff6ff; --blue-mid:#bfdbfe;
  --grad:linear-gradient(135deg,#eaf2fe 0%,#dfeafa 100%);
  --card:#ffffff; --bg:#f6f9fd; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --radius:14px; --shadow:0 1px 3px rgba(16,60,130,.06),0 6px 20px rgba(16,60,130,.05);
}
html,body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

header{background:var(--grad);border-bottom:1px solid var(--blue-mid)}
.bar{max-width:1120px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;color:var(--blue-strong);font-size:15px}
.back{font-size:13px;color:var(--blue-strong);background:#fff;border:1px solid var(--blue-mid);padding:6px 14px;border-radius:999px;font-weight:600}
.back:hover{background:var(--blue-soft)}

.hero{max-width:1120px;margin:0 auto;padding:38px 24px 6px}
.eyebrow{display:inline-flex;font-size:12px;color:var(--blue-strong);background:#fff;border:1px solid var(--blue-mid);padding:4px 13px;border-radius:999px;font-weight:600}
.hero h1{font-size:27px;font-weight:800;margin:13px 0 10px;color:#16324f;line-height:1.3}
.hero .sub{font-size:14px;color:#46607e;max-width:820px}
.hero .sub b{color:var(--blue-strong)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1120px;margin:22px auto 0;padding:0 24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);text-align:center}
.stat .v{font-size:22px;font-weight:800;color:var(--blue-strong);font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}

/* grid */
section.grid{max-width:1120px;margin:28px auto 0;padding:0 24px}
.grid-head{font-size:17px;font-weight:800;color:#16324f;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
video{width:100%;display:block;background:#000;aspect-ratio:16/9}
.card .name{font-size:15px;font-weight:800;color:#16324f;padding:13px 16px 4px}
.card .intro{font-size:12.5px;color:var(--muted);padding:0 16px 14px;line-height:1.65}
.card .grade{font-size:11px;color:var(--blue-strong);background:var(--blue-soft);align-self:flex-start;margin:0 16px 12px;padding:3px 10px;border-radius:999px;font-weight:600}

footer{margin:52px 0 0;background:#15304f;color:#cfe0f5;padding:26px 24px;text-align:center;font-size:13px}

@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">创新创业竞赛咨询工作室</div>
    <a class="back" href="index.html">← 返回作品集</a>
  </div>
</header>

<section class="hero">
  <span class="eyebrow">创新创业 · 项目孵化与咨询</span>
  <h1>创新创业竞赛咨询工作室</h1>
  <div class="sub">
    面向高校双创团队的竞赛咨询服务：设计差异化服务套餐、建立标准化项目管理流程，构建
    <b>「内容营销—校园KOL推荐—机构渠道合作—客户转介绍」</b>多元获客体系。以下 9 个项目为工作室
    辅导孵化的创新创业竞赛项目，页面为<b>静音自动同时播放</b>，可点击任意一个单独暂停或播放。
  </div>
</section>

<div class="stats">
  <div class="stat"><div class="v">200+</div><div class="l">累计辅导项目数</div></div>
  <div class="stat"><div class="v">5万+</div><div class="l">累计营收（元）</div></div>
  <div class="stat"><div class="v">10+</div><div class="l">覆盖高校（名列北大、浙大、中农大等）</div></div>
</div>

<section class="grid">
  <div class="grid-head">代表作 · 项目路演视频（打开即静音同时播放）</div>
  <div class="cards" id="cards"></div>
</section>

<footer>工作室服务于创新创业与学科竞赛项目 · 视频内容为项目路演 · 数据以工作室实际运营为准</footer>

<script>
const PROJECTS = [
  { file:'云上领菌.mp4', name:'云上领菌', dur:'1:30', intro:'食用菌智慧种植与云端管理平台，打造菌菇产业的数字化生产与供应链体系。', tag:'创新创业竞赛项目' },
  { file:'古韵敦煌.mp4', name:'古韵敦煌', dur:'1:14', intro:'以敦煌文化为内核的数字文创与文旅融合项目，探索文化IP的产业化路径。', tag:'创新创业竞赛项目' },
  { file:'大道治碱.mp4', name:'大道治碱', dur:'1:30', intro:'盐碱地生物改良技术方案，助力中低产田改造与粮食安全。', tag:'创新创业竞赛项目' },
  { file:'尾净生肥.mp4', name:'尾净生肥', dur:'1:09', intro:'养殖尾水净化与有机肥资源化利用，构建绿色循环农业模式。', tag:'创新创业竞赛项目' },
  { file:'振能生电.mp4', name:'振能生电', dur:'1:38', intro:'振动能量收集与微能源转化技术，面向低功耗智能设备的自供电方案。', tag:'创新创业竞赛项目' },
  { file:'氢溢求清.mp4', name:'氢溢求清', dur:'1:29', intro:'绿氢制备与清洁能源转化项目，聚焦氢能产业链关键技术环节。', tag:'创新创业竞赛项目' },
  { file:'纹创未来.mp4', name:'纹创未来', dur:'1:04', intro:'纹样文化数字化与智能设计平台，推动传统纹样的现代应用再创造。', tag:'创新创业竞赛项目' },
  { file:'菌擎黔酸.mp4', name:'菌擎黔酸', dur:'0:58', intro:'酱香型微生物发酵技术项目，服务贵州特色发酵产业的提质增效。', tag:'创新创业竞赛项目' },
  { file:'逻辑比特.mp4', name:'逻辑比特', dur:'1:30', intro:'面向青少年的编程教育与AI思维培养项目，构建普惠化的计算思维课程体系。', tag:'创新创业竞赛项目' },
];

const cards = document.getElementById('cards');
PROJECTS.forEach(function(p){
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML =
    '<video controls preload="metadata" muted playsinline autoplay loop data-name="' + p.name + '">' +
    '<source src="创新创业竞赛咨询工作室/压缩/' + p.file + '" type="video/mp4">' +
    '您的浏览器不支持视频播放。</video>' +
    '<div class="name">' + p.name + '</div>' +
    '<div class="intro">' + p.intro + '</div>' +
    '<span class="grade">' + p.tag + ' · ' + p.dur + '</span>';
  cards.appendChild(div);
});

/* 打开页面即 9 个视频静音同时播放：显式 play()，并监听 canplay 兜底 */
function tryPlayAll(){
  document.querySelectorAll('#cards video').forEach(function(v){
    var p = v.play();
    if (p && p.catch) p.catch(function(){});
  });
}
document.querySelectorAll('#cards video').forEach(function(v){
  v.addEventListener('canplay', function(){ if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function(){}); } });
});
setTimeout(tryPlayAll, 800);
setTimeout(tryPlayAll, 2500);
tryPlayAll();
</script>
</body>
</html>
